# Ablation arm "ema": normaliser: exponential mean of log energy (DeepFilterNet-style) instead of the running median.
# All arms: identical data order (seed 101), 2500 steps from scratch, full cosine schedule, batch 16 x 3 s,
# same validation set; evaluated on the full defence_v1 test set.  Short-budget comparison (not a converged model).
name: abl_ema
seed: 101
segment_s: 3.0
batch_size: 16
lr: 0.001
lr_min: 0.00002
warmup_steps: 300
max_steps: 2500
max_hours: 1.5
grad_clip: 5.0
weight_decay: 0.0001
workers: 4
val_workers: 3
log_every: 100
val_every: 1250
val_n: 200
use_synth: true
speech_manifest: speech_train_v2.json
ema_decay: 0.995
mix_opts: {p_timbre: 0.2, p_clean_only: 0.05, p_noise_only: 0.02}
model: {c: 80, c2: 40, c1: 20, n_dp: 3, df_order: 5, lookahead: 0, norm_type: ema}
loss: {w_spec: 1.0, w_mr: 1.0, w_sisdr: 1.0, w_pmsqe: 1.0, w_asym: 0.5, w_spp: 0.1}
