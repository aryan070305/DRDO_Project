# Two-microphone DANCNet-v3 (primary + reference mic as network inputs), 40 ms, warm-started from v3hq.
name: v3_2mic
init_ckpt: checkpoints/v3hq/best.pt
seed: 61
segment_s: 3.0
batch_size: 16
lr: 0.0003
lr_min: 0.00001
warmup_steps: 300
max_steps: 5000
max_hours: 3.0
grad_clip: 5.0
weight_decay: 0.0001
workers: 4
val_workers: 3
log_every: 100
val_every: 1000
ema_decay: 0.998
speech_manifest: speech_train_v2.json
mix_opts: {p_timbre: 0.2, p_clean_only: 0.03, p_noise_only: 0.02}
model: {c: 96, c2: 48, c1: 24, n_dp: 4, df_order: 5, lookahead: 2}
loss: {w_spec: 1.0, w_mr: 1.0, w_sisdr: 1.0, w_pmsqe: 1.0, w_asym: 0.5, w_spp: 0.1}
