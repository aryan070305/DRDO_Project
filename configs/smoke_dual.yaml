# Smoke test of the two-microphone training path (warm start from the deployed HQ). Not a real run.
name: smoke_dual
init_ckpt: checkpoints/hq/best.pt
seed: 2
segment_s: 2.0
batch_size: 2
lr: 0.0003
lr_min: 0.00001
warmup_steps: 1
max_steps: 3
workers: 1
val_workers: 2
val_every: 3
log_every: 1
device: cpu
speech_manifest: speech_train_v2.json
model: {c: 80, c2: 40, c1: 20, n_dp: 3, df_order: 5, lookahead: 2}
loss: {w_spec: 1.0, w_mr: 1.0, w_sisdr: 1.0, w_pmsqe: 1.0, w_asym: 0.5, w_spp: 0.1}
