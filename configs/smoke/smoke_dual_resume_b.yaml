# smoke test of train_dual --resume (tiny model, CPU), run by hand on 2026-10-05 to test the round-2 resume fixes
# (EMA restore, optimizer state, final save); restore_ema itself is unit-tested in tests/test_train_resume.py
name: smoke_dual_resume
seed: 3
device: cpu
segment_s: 1.0
batch_size: 2
lr: 0.001
lr_min: 0.00001
warmup_steps: 2
max_steps: 20
max_hours: 0.003
workers: 1
val_workers: 2
log_every: 1
val_every: 100
ema_decay: 0.9
speech_manifest: speech_train_v2.json
model: {c: 16, c2: 8, c1: 8, n_dp: 1, df_order: 3, lookahead: 0}
loss: {w_spec: 1.0, w_mr: 1.0, w_sisdr: 1.0, w_pmsqe: 1.0, w_asym: 0.5, w_spp: 0.1}
